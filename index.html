<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YoFunnyTube</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#003175;
    color:white;
}

/* AUTH */
#auth{
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.box{
    background:#2E85FF;
    padding:20px;
    border-radius:12px;
    width:280px;
    display:flex;
    flex-direction:column;
    gap:10px;
}

input,button{
    padding:10px;
    border:none;
    border-radius:8px;
}

button{
    background:#0047AB;
    color:white;
    cursor:pointer;
}

/* APP */
#app{display:none;}

.topbar{
    background:#8ABBFF;
    color:#0047AB;
    padding:10px;
    display:flex;
    justify-content:space-between;
    font-weight:bold;
}

.main{padding:15px;}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
}

.card{
    background:#2E85FF;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.title{
    padding:8px;
    font-weight:bold;
}

.small{
    font-size:12px;
    padding:0 8px 8px;
}

video{
    width:100%;
    max-width:800px;
    background:black;
    border-radius:10px;
}

.comment{
    background:#2E85FF;
    margin-top:6px;
    padding:6px;
    border-radius:8px;
    display:flex;
    justify-content:space-between;
}
</style>
</head>

<body>

<!-- AUTH -->
<div id="auth">

<div class="box">
    <h3>YoFunnyTube</h3>

    <input id="email" placeholder="Email">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="signup()">Sign Up</button>
    <button onclick="login()">Log In</button>
</div>

</div>

<!-- APP -->
<div id="app">

<div class="topbar">
    <div>YoFunnyTube</div>
    <div>
        <span id="user"></span>
        <button onclick="logout()">Logout</button>
    </div>
</div>

<div class="main">

<h3>Upload Video</h3>

<input id="titleInput" placeholder="Video title">
<input type="file" id="videoFile" accept="video/*">
<input type="file" id="thumbFile" accept="image/*">
<button onclick="upload()">Upload</button>

<hr>

<div id="home" class="grid"></div>

<div id="watch" style="display:none;">
    <button onclick="back()">⬅ Back</button>

    <h2 id="watchTitle"></h2>

    <video id="player" controls></video>

    <div>
        <button onclick="like()">👍 <span id="likeNum">0</span></button>
        <button onclick="dislike()">👎 <span id="dislikeNum">0</span></button>
        <button onclick="deleteVideo()" style="background:red;">🗑 Delete</button>
    </div>

    <h3>Comments</h3>

    <input id="commentInput" placeholder="Add comment">
    <button onclick="addComment()">Post</button>

    <div id="comments"></div>

</div>

</div>

<script>

/* STORAGE */
let users = JSON.parse(localStorage.getItem("users")) || [];
let videos = JSON.parse(localStorage.getItem("videos")) || [];
let currentUser = localStorage.getItem("currentUser");

let current = null;

/* ---------------- AUTH ---------------- */
function signup(){

    users.push({
        email:email.value,
        username:username.value,
        password:password.value
    });

    localStorage.setItem("users",JSON.stringify(users));
    alert("Account created");
}

function login(){

    let u = users.find(x =>
        x.email===email.value &&
        x.password===password.value
    );

    if(!u){
        alert("Wrong login");
        return;
    }

    currentUser=u.username;
    localStorage.setItem("currentUser",currentUser);

    start();
}

function logout(){
    localStorage.removeItem("currentUser");
    location.reload();
}

/* ---------------- START ---------------- */
function start(){
    auth.style.display="none";
    app.style.display="block";
    user.textContent=currentUser;
    render();
}

if(currentUser) start();

/* ---------------- UPLOAD ---------------- */
function upload(){

    const file = videoFile.files[0];
    const thumb = thumbFile.files[0];
    const title = titleInput.value || "Untitled";

    if(!file || !thumb){
        alert("Pick video + thumbnail");
        return;
    }

    const videoURL = URL.createObjectURL(file);

    const reader = new FileReader();

    reader.onload = function(){

        videos.push({
            title,
            video: videoURL,
            thumb: reader.result,

            likes:0,
            dislikes:0,
            userVote:null,

            comments:[]
        });

        save();
        render();
        alert("Uploaded!");
    };

    reader.readAsDataURL(thumb);
}

/* ---------------- SAVE ---------------- */
function save(){
    localStorage.setItem("videos",JSON.stringify(videos));
}

/* ---------------- RENDER ---------------- */
function render(){

    home.innerHTML="";

    videos.forEach((v,i)=>{

        const div=document.createElement("div");
        div.className="card";

        div.innerHTML=`
            <img src="${v.thumb}">
            <div class="title">${v.title}</div>
            <div class="small">👍 ${v.likes || 0} 👎 ${v.dislikes || 0}</div>
        `;

        div.onclick=()=>open(i);

        home.appendChild(div);
    });
}

/* ---------------- OPEN ---------------- */
function open(i){

    current=i;
    let v=videos[i];

    home.style.display="none";
    watch.style.display="block";

    watchTitle.textContent=v.title;
    player.src=v.video;

    updateUI();
    renderComments();
}

/* ---------------- BACK ---------------- */
function back(){
    home.style.display="grid";
    watch.style.display="none";
}

/* ---------------- LIKE (FIXED TOGGLE) ---------------- */
function like(){

    let v=videos[current];

    if(!v.likes) v.likes=0;
    if(!v.dislikes) v.dislikes=0;

    if(v.userVote==="like"){
        v.likes--;
        v.userVote=null;
    }else{
        if(v.userVote==="dislike") v.dislikes--;

        v.likes++;
        v.userVote="like";
    }

    save();
    updateUI();
    render();
}

/* ---------------- DISLIKE (FIXED TOGGLE) ---------------- */
function dislike(){

    let v=videos[current];

    if(!v.likes) v.likes=0;
    if(!v.dislikes) v.dislikes=0;

    if(v.userVote==="dislike"){
        v.dislikes--;
        v.userVote=null;
    }else{
        if(v.userVote==="like") v.likes--;

        v.dislikes++;
        v.userVote="dislike";
    }

    save();
    updateUI();
    render();
}

/* ---------------- DELETE ---------------- */
function deleteVideo(){

    videos.splice(current,1);
    save();
    back();
    render();
}

/* ---------------- UI UPDATE ---------------- */
function updateUI(){

    let v=videos[current];

    likeNum.textContent=v.likes || 0;
    dislikeNum.textContent=v.dislikes || 0;
}

/* ---------------- COMMENTS ---------------- */
function addComment(){

    let v=videos[current];

    if(!v.comments) v.comments=[];

    v.comments.push(commentInput.value);
    commentInput.value="";

    save();
    renderComments();
}

function renderComments(){

    comments.innerHTML="";

    let v=videos[current];

    if(!v.comments) v.comments=[];

    v.comments.forEach((c,i)=>{

        let div=document.createElement("div");
        div.className="comment";

        div.innerHTML=`
            <span>${c}</span>
            <button onclick="deleteComment(${i})">X</button>
        `;

        comments.appendChild(div);
    });
}

function deleteComment(i){
    videos[current].comments.splice(i,1);
    save();
    renderComments();
}

</script>

</body>
</html>
