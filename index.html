<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>YoFunnyTube</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@700;900&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
    background:#003175;
    color:white;
}

/* Topbar adjusted to display logo and notifications */
.topbar{
    background:#8ABBFF;
    padding:15px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.topbar-left {
    display: flex;
    align-items: center;
}

.topbar-logo {
    height: 35px;
    width: auto;
    object-fit: contain;
    cursor: pointer;
}

/* Notification Bell Styling */
.notification-container {
    position: relative;
    display: inline-block;
}

.notification-btn {
    background: #0047AB;
    border: none;
    font-size: 20px;
    padding: 8px 12px;
    border-radius: 50%;
    cursor: pointer;
    color: white;
    position: relative;
}

.notification-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #CC1A1A;
    color: white;
    font-size: 11px;
    font-weight: bold;
    padding: 2px 6px;
    border-radius: 50%;
    display: none;
}

.notification-dropdown {
    display: none;
    position: absolute;
    right: 0;
    top: 45px;
    background: #0047AB;
    border: 2px solid #8ABBFF;
    border-radius: 8px;
    width: 320px;
    max-height: 350px;
    overflow-y: auto;
    z-index: 1000;
    box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
}

.notification-item {
    padding: 12px;
    border-bottom: 1px solid #1A66CC;
    font-size: 13px;
    cursor: pointer;
    word-break: break-word;
}

.notification-item:hover {
    background: #1A66CC;
}

.notification-item.unread {
    background: #003175;
    font-weight: bold;
    border-left: 4px solid #8ABBFF;
}

.clear-notifications-btn {
    width: 100%;
    background: #CC1A1A;
    border-radius: 0 0 6px 6px;
    padding: 10px;
    font-size: 12px;
}

.auth{
    background:#0047AB;
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
}

.upload-section {
    background:#1A66CC;
    padding:15px;
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    align-items:center;
    border-bottom: 2px solid #0047AB;
}

.upload-section label {
    font-size: 14px;
    font-weight: bold;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:15px;
    padding:15px;
}

.card{
    background:#2E85FF;
    border-radius:12px;
    overflow:hidden;
}

.card .thumb-link {
    cursor: pointer;
    width: 100%;
    height: 160px;
    display: block;
}

.card .thumb-link img {
    width:100%;
    height:100%;
    object-fit:cover;
}

.title{
    padding:8px;
    font-weight:bold;
}

.small{
    padding:8px;
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
}

.username{
    cursor:pointer;
    text-decoration:underline;
}

button{
    border:none;
    padding:10px;
    border-radius:8px;
    cursor:pointer;
    background:#0047AB;
    color:white;
    font-weight: bold;
}

button:hover {
    background: #003175;
}

.delete-btn {
    background: #CC1A1A;
    float: right;
}

.delete-btn:hover {
    background: #8B0000;
}

.comment-delete-btn {
    background: #CC1A1A;
    padding: 4px 8px;
    font-size: 11px;
    border-radius: 4px;
    margin-left: auto;
}

input{
    padding:10px;
    border:none;
    border-radius:8px;
}

.page{
    display:none;
    padding:15px;
}

#watchPage {
    max-width: 800px;
    margin: 0 auto;
}

#watchPage video {
    width: 100%;
    max-height: 450px;
    background: #000;
    border-radius: 12px;
}

#watchPage .watch-title {
    font-size: 24px;
    font-weight: bold;
    margin: 15px 0 5px 0;
}

.video-actions {
    display: flex;
    gap: 10px;
    margin: 15px 0;
    border-bottom: 1px solid #8ABBFF;
    padding-bottom: 15px;
}

.action-btn {
    background: #1A66CC;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 10px 15px;
}

.action-btn.active {
    background: #8ABBFF;
    color: #0047AB;
}

.comments-section {
    margin-top: 30px;
    background: #1A66CC;
    padding: 20px;
    border-radius: 12px;
}

.comments-section h3 {
    margin-top: 0;
    border-bottom: 1px solid #8ABBFF;
    padding-bottom: 10px;
}

.comment-input-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

.comment-input-box input {
    flex: 1;
}

.comment-list {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

.comment-item {
    background: #0047AB;
    padding: 12px;
    border-radius: 8px;
    display: flex;
    gap: 10px;
    align-items: center;
}

.comment-content {
    display: flex;
    flex-direction: column;
    gap: 2px;
}

.comment-text {
    word-break: break-word;
}

#homePage{
    display:grid;
}
</style>
</head>

<body>

<div class="topbar">
    <div class="topbar-left">
        <img src="file:///C:/Users/Owner/Downloads/costume1%20(2).png" alt="Logo" class="topbar-logo" onclick="backHome()">
    </div>
    
    <div class="notification-container">
        <button class="notification-btn" onclick="toggleNotificationDropdown(event)">🔔 <span id="notiBadge" class="notification-badge">0</span></button>
        <div id="notiDropdown" class="notification-dropdown">
            <div id="notiList"></div>
            <button class="clear-notifications-btn" onclick="clearNotifications(event)">Clear All</button>
        </div>
    </div>
</div>

<div class="auth">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">

    <button onclick="register(event)">Register</button>
    <button onclick="login(event)">Login</button>
    <button onclick="logout(event)">Logout</button>

    <input type="file" id="pfpInput" accept="image/*">
    <button onclick="changePFP(event)">Change PFP</button>

    <span id="who"></span>
</div>

<div class="upload-section">
    <input id="videoTitle" placeholder="Video Title">
    
    <label for="thumbInput">Thumbnail:</label>
    <input type="file" id="thumbInput" accept="image/*">
    
    <label for="videoFileInput">Video File:</label>
    <input type="file" id="videoFileInput" accept="video/*">
    
    <button onclick="uploadVideo(event)">Upload Video</button>
</div>

<div id="homePage" class="grid"></div>

<div id="watchPage" class="page">
    <button id="deleteBtn" class="delete-btn" onclick="deleteVideo(event)">🗑 Delete Video</button>
    
    <div style="margin-top: 15px;" id="videoPlayerContainer"></div>
    <div id="videoDisplayTitle" class="watch-title"></div>
    
    <div class="video-actions" id="videoActionsPanel"></div>
    
    <div class="small" id="videoDisplayMeta"></div>

    <div class="comments-section">
        <h3>Comments</h3>
        <div class="comment-input-box">
            <input id="commentInput" placeholder="Add a public comment...">
            <button onclick="addComment(event)">Comment</button>
        </div>
        <div id="commentList" class="comment-list"></div>
    </div>
</div>

<div id="profilePage" class="page">
    <h2 id="profileTitle"></h2>
    <div id="profileVideos" class="grid"></div>
</div>

<script>

const DEFAULT_PFP = "https://pbs.twimg.com/media/FeToVEqX0Acjv0i.png";
const DEFAULT_THUMB = "https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=500";
const FALLBACK_VIDEO = "https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4";

/* HTML SECURITY ESCAPER */
function esc(str) {
    return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
}

/* STORAGE HELPERS */
function getUsers(){
    return JSON.parse(localStorage.getItem("users") || "[]");
}

function setUsers(u){
    localStorage.setItem("users", JSON.stringify(u));
}

function getNotifications() {
    return JSON.parse(localStorage.getItem("notifications") || "[]");
}

function setNotifications(n) {
    localStorage.setItem("notifications", JSON.stringify(n));
}

/* VIDEOS DATABASE SYSTEM */
let videos = JSON.parse(localStorage.getItem("videos") || "[]");

/* CURRENT RUNTIME STATE TRACKERS */
let currentUser = localStorage.getItem("currentUser");
let currentVideoIndex = null;

/* UI HEADER */
function updateUI(){
    const users = getUsers();
    const u = users.find(x => x.username === currentUser);
    const whoElement = document.getElementById("who");

    whoElement.innerHTML = "";

    if (currentUser) {
        const pfpSrc = u && u.pfp ? u.pfp : DEFAULT_PFP;
        const img = document.createElement("img");
        img.src = pfpSrc;
        img.style.cssText = "width:25px;height:25px;border-radius:50%;vertical-align:middle;object-fit:cover;margin-right:5px;";
        
        whoElement.appendChild(img);
        whoElement.appendChild(document.createTextNode(" " + esc(currentUser)));
    } else {
        whoElement.textContent = "Not logged in";
    }
    renderNotifications();
}

/* NOTIFICATION DROPDOWN CONTROLS */
function toggleNotificationDropdown(e) {
    if(e) e.stopPropagation();
    const dropdown = document.getElementById("notiDropdown");
    if(dropdown.style.display === "block") {
        dropdown.style.display = "none";
    } else {
        dropdown.style.display = "block";
        markNotificationsRead();
    }
}

function renderNotifications() {
    const badge = document.getElementById("notiBadge");
    const list = document.getElementById("notiList");
    list.innerHTML = "";

    if (!currentUser) {
        badge.style.display = "none";
        list.innerHTML = `<div class="notification-item">Log in to view notifications</div>`;
        return;
    }

    const allNotis = getNotifications();
    const myNotis = allNotis.filter(n => n.receiver === currentUser).reverse();
    const unreadCount = myNotis.filter(n => !n.read).length;

    if (unreadCount > 0) {
        badge.textContent = unreadCount;
        badge.style.display = "block";
    } else {
        badge.style.display = "none";
    }

    if (myNotis.length === 0) {
        list.innerHTML = `<div class="notification-item">No new alerts</div>`;
        return;
    }

    myNotis.forEach(n => {
        const div = document.createElement("div");
        div.className = `notification-item ${!n.read ? 'unread' : ''}`;
        
        if (n.type === "like") {
            div.textContent = `👍 ${n.author} liked your video "${n.videoTitle}"`;
        } else {
            div.textContent = `💬 ${n.author} commented: "${n.text}" on your video "${n.videoTitle}"`;
        }
        
        div.addEventListener("click", () => {
            const targetIdx = videos.findIndex(v => v.title === n.videoTitle && v.uploader === currentUser);
            if (targetIdx !== -1) {
                document.getElementById("notiDropdown").style.display = "none";
                openVideo(targetIdx);
            } else {
                alert("This video has been deleted.");
            }
        });
        list.appendChild(div);
    });
}

function markNotificationsRead() {
    if (!currentUser) return;
    let allNotis = getNotifications();
    allNotis.forEach(n => {
        if(n.receiver === currentUser) n.read = true;
    });
    setNotifications(allNotis);
    document.getElementById("notiBadge").style.display = "none";
    renderNotifications();
}

function clearNotifications(e) {
    if(e) e.stopPropagation();
    if (!currentUser) return;
    let allNotis = getNotifications();
    allNotis = allNotis.filter(n => n.receiver !== currentUser);
    setNotifications(allNotis);
    renderNotifications();
}

window.addEventListener("click", () => {
    document.getElementById("notiDropdown").style.display = "none";
});

/* REGISTER */
function register(e){
    if(e) e.preventDefault();
    const users = getUsers();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();

    if(!u || !p) return alert("Fields cannot be empty");
    if(users.some(x => x.username === u)){
        return alert("Username taken");
    }

    users.push({
        username: u,
        password: p,
        pfp: DEFAULT_PFP
    });

    setUsers(users);
    alert("Account created successfully! You can now click Login.");
}

/* LOGIN */
function login(e){
    if(e) e.preventDefault();
    const users = getUsers();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value.trim();

    const found = users.find(x => x.username === u && x.password === p);

    if(!found) return alert("Wrong username or password");

    currentUser = u;
    localStorage.setItem("currentUser", u);

    if (!videos.some(v => v.uploader === u)) {
        videos.push({
            uploader: u,
            title: `First vlog from ${u}!`,
            thumb: "https://images.unsplash.com/photo-1516280440614-37939bbacd6a?w=500",
            src: FALLBACK_VIDEO,
            likes: [],
            dislikes: [],
            comments: []
        });
        localStorage.setItem("videos", JSON.stringify(videos));
    }

    updateUI();
    render();
}

/* LOGOUT */
function logout(e){
    if(e) e.preventDefault();
    currentUser = null;
    localStorage.removeItem("currentUser");
    document.getElementById("username").value = "";
    document.getElementById("password").value = "";
    updateUI();
    render();
}

/* PFP UPDATE */
function changePFP(e){
    if(e) e.preventDefault();
    if(!currentUser) return alert("Login first");

    let file = document.getElementById("pfpInput").files[0];
    if(!file) return alert("Pick image");

    let reader = new FileReader();

    reader.onload = function(e){
        let img = new Image();
        img.onload = function() {
            let canvas = document.createElement("canvas");
            canvas.width = 100;
            canvas.height = 100;
            let ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, 100, 100);
            let compressedPfp = canvas.toDataURL("image/jpeg", 0.6);

            const users = getUsers();
            const updated = users.map(u => {
                if(u.username === currentUser){
                    return {...u, pfp: compressedPfp};
                }
                return u;
            });

            setUsers(updated);
            updateUI();
            render();
            alert("PFP updated");
        };
        img.src = e.target.result;
    };

    reader.readAsDataURL(file);
}

/* LOCAL FILE VIDEO UPLOAD PROCESSING */
function uploadVideo(e) {
    if(e) e.preventDefault();
    if (!currentUser) return alert("Please log in to upload videos");

    const titleInput = document.getElementById("videoTitle");
    const thumbFileInput = document.getElementById("thumbInput");
    const videoFileInput = document.getElementById("videoFileInput");

    const title = titleInput.value.trim();
    if (!title) return alert("Please enter a video title");

    const videoFile = videoFileInput.files[0];
    if (!videoFile) return alert("Please select a video file from your computer");

    const thumbFile = thumbFileInput.files[0];

    const readAsDataURL = (file) => {
        return new Promise((resolve) => {
            if (!file) resolve(null);
            const reader = new FileReader();
            reader.onload = (ev) => resolve(ev.target.result);
            reader.readAsDataURL(file);
        });
    };

    Promise.all([readAsDataURL(thumbFile), readAsDataURL(videoFile)]).then(([thumbBase64, videoBase64]) => {
        try {
            videos.push({
                uploader: currentUser,
                title: title,
                thumb: thumbBase64 || DEFAULT_THUMB,
                src: videoBase64 || FALLBACK_VIDEO,
                likes: [],
                dislikes: [],
                comments: []
            });

            localStorage.setItem("videos", JSON.stringify(videos));
            
            titleInput.value = "";
            thumbFileInput.value = "";
            videoFileInput.value = "";
            
            render();
            alert("Video successfully uploaded!");
        } catch (error) {
            alert("Storage limit exceeded! Browser storage only allows up to 5MB total. Please try a much smaller or shorter video clip.");
            videos.pop();
        }
    });
}

/* WATCH PAGE LAUNCH & ACTION CONTROL ROUTINES */
function openVideo(index) {
    currentVideoIndex = index;
    const targetVideo = videos[index];
    if (!targetVideo) return;

    if (!targetVideo.likes) targetVideo.likes = [];
    if (!targetVideo.dislikes) targetVideo.dislikes = [];
    if (!targetVideo.comments) targetVideo.comments = [];

    const deleteBtn = document.getElementById("deleteBtn");
    if (currentUser && currentUser === targetVideo.uploader) {
        deleteBtn.style.display = "block";
    } else {
        deleteBtn.style.display = "none";
    }

    document.getElementById("homePage").style.display = "none";
    document.getElementById("profilePage").style.display = "none";
    
    const watchPageElement = document.getElementById("watchPage");
    watchPageElement.style.display = "block";

    const playerContainer = document.getElementById("videoPlayerContainer");
    playerContainer.innerHTML = "";

    const videoEl = document.createElement("video");
    videoEl.src = targetVideo.src || FALLBACK_VIDEO;
    videoEl.controls = true;
    videoEl.autoplay = true;
    videoEl.poster = targetVideo.thumb;
    playerContainer.appendChild(videoEl);

    document.getElementById("videoDisplayTitle").textContent = targetVideo.title;

    renderActionsPanel(index);
    renderCommentsSection();

    const users = getUsers();
    const user = users.find(u => u.username === targetVideo.uploader);
    const pfp = user && user.pfp ? user.pfp : DEFAULT_PFP;

    const metaContainer = document.getElementById("videoDisplayMeta");
    metaContainer.innerHTML = "";

    const pfpImg = document.createElement("img");
    pfpImg.src = pfp;
    pfpImg.style.cssText = "width:25px;height:25px;border-radius:50%;object-fit:cover;";
    metaContainer.appendChild(pfpImg);

    const userSpan = document.createElement("span");
    userSpan.className = "username";
    userSpan.textContent = targetVideo.uploader;
    userSpan.addEventListener("click", function(event) {
        openProfile(event, targetVideo.uploader);
    });
    metaContainer.appendChild(userSpan);
}

/* DELETE VIDEO LOGIC */
function deleteVideo(e) {
    if(e) e.preventDefault();
    if(currentVideoIndex === null) return;
    
    const targetVideo = videos[currentVideoIndex];
    if (!currentUser || currentUser !== targetVideo.uploader) {
        return alert("Unauthorized access action.");
    }

    if (confirm("Are you sure you want to delete this video permanently?")) {
        videos.splice(currentVideoIndex, 1);
        localStorage.setItem("videos", JSON.stringify(videos));
        alert("Video has been removed.");
        backHome();
    }
}

/* COMMENTS RENDER GENERATION ROUTINE WITH DELETE OPTIONS */
function renderCommentsSection() {
    if (currentVideoIndex === null) return;
    const v = videos[currentVideoIndex];
    const users = getUsers();
    
    const listContainer = document.getElementById("commentList");
    listContainer.innerHTML = "";

    if (!v.comments) v.comments = [];

    v.comments.forEach((c, cIdx) => {
        const commenterUser = users.find(u => u.username === c.author);
        const commenterPfp = commenterUser && commenterUser.pfp ? commenterUser.pfp : DEFAULT_PFP;

        const itemDiv = document.createElement("div");
        itemDiv.className = "comment-item";

        const pfpImg = document.createElement("img");
        pfpImg.src = commenterPfp;
        pfpImg.style.cssText = "width:30px;height:30px;border-radius:50%;object-fit:cover;margin-right:10px;";
        itemDiv.appendChild(pfpImg);

        const contentWrap = document.createElement("div");
        contentWrap.className = "comment-content";

        const nameSpan = document.createElement("span");
        nameSpan.className = "username";
        nameSpan.style.fontWeight = "bold";
        nameSpan.textContent = c.author;
        nameSpan.addEventListener("click", function(event) {
            openProfile(event, c.author);
        });
        contentWrap.appendChild(nameSpan);

        const textDiv = document.createElement("div");
        textDiv.className = "comment-text";
        textDiv.textContent = c.text;
        contentWrap.appendChild(textDiv);

        itemDiv.appendChild(contentWrap);

        // RENDER DELETE BUTTON ONLY IF: User is video creator OR User is comment author
        if (currentUser && (currentUser === v.uploader || currentUser === c.author)) {
            const delBtn = document.createElement("button");
            delBtn.className = "comment-delete-btn";
            delBtn.textContent = "🗑";
            delBtn.title = "Delete Comment";
            delBtn.onclick = (e) => deleteComment(e, cIdx);
            itemDiv.appendChild(delBtn);
        }

        listContainer.appendChild(itemDiv);
    });
}

/* ADD COMMENT & LOG NOTIFICATION ALERTS */
function addComment(e) {
    if(e) e.preventDefault();
    if (!currentUser) return alert("You must be logged in to comment!");
    if (currentVideoIndex === null) return;

    const inputField = document.getElementById("commentInput");
    const commentText = inputField.value.trim();
    if (!commentText) return alert("Comment cannot be empty!");

    const videoObj = videos[currentVideoIndex];
    if (!videoObj.comments) videoObj.comments = [];

    videoObj.comments.push({
        author: currentUser,
        text: commentText
    });

    localStorage.setItem("videos", JSON.stringify(videos));

    if (videoObj.uploader !== currentUser) {
        let allNotis = getNotifications();
        allNotis.push({
            receiver: videoObj.uploader,
            author: currentUser,
            videoTitle: videoObj.title,
            text: commentText,
            type: "comment",
            read: false
        });
        setNotifications(allNotis);
    }

    inputField.value = "";
    renderCommentsSection();
    renderNotifications();
}

/* DELETE COMMENT LOGIC */
function deleteComment(e, cIdx) {
    if(e) e.stopPropagation();
    if(currentVideoIndex === null) return;

    if(confirm("Delete this comment permanently?")) {
        videos[currentVideoIndex].comments.splice(cIdx, 1);
        localStorage.setItem("videos", JSON.stringify(videos));
        renderCommentsSection();
    }
}

/* RENDERING FUNCTION FOR LIKE/DISLIKE/SHARE ACTIONS BUTTONS */
function renderActionsPanel(index) {
    const v = videos[index];
    const panel = document.getElementById("videoActionsPanel");
    panel.innerHTML = "";

    const likeBtn = document.createElement("button");
    likeBtn.className = "action-btn";
    if(currentUser && v.likes.includes(currentUser)) likeBtn.classList.add("active");
    likeBtn.innerHTML = `👍 <span>${v.likes ? v.likes.length : 0}</span>`;
    likeBtn.onclick = () => toggleLike(index);

    const dislikeBtn = document.createElement("button");
    dislikeBtn.className = "action-btn";
    if(currentUser && v.dislikes.includes(currentUser)) dislikeBtn.classList.add("active");
    dislikeBtn.innerHTML = `👎 <span>${v.dislikes ? v.dislikes.length : 0}</span>`;
    dislikeBtn.onclick = () => toggleDislike(index);

    const shareBtn = document.createElement("button");
    shareBtn.className = "action-btn";
    shareBtn.innerHTML = `🔗 Share`;
    shareBtn.onclick = () => copyShareLink(index);

    panel.appendChild(likeBtn);
    panel.appendChild(dislikeBtn);
    panel.appendChild(shareBtn);
}

/* LIKE ACTION PROCESSING LOGIC */
function toggleLike(index) {
    if (!currentUser) return alert("You must be logged in to like videos!");
    const v = videos[index];

    if (!v.likes) v.likes = [];
    if (!v.dislikes) v.dislikes = [];

    if (v.likes.includes(currentUser)) {
        v.likes = v.likes.filter(user => user !== currentUser);
    } else {
        v.likes.push(currentUser);
        v.dislikes = v.dislikes.filter(user => user !== currentUser);

        if (v.uploader !== currentUser) {
            let allNotis = getNotifications();
            allNotis.push({
                receiver: v.uploader,
                author: currentUser,
                videoTitle: v.title,
                text: "",
                type: "like",
                read: false
            });
            setNotifications(allNotis);
            renderNotifications();
        }
    }

    localStorage.setItem("videos", JSON.stringify(videos));
    renderActionsPanel(index);
}

/* DISLIKE ACTION PROCESSING LOGIC */
function toggleDislike(index) {
    if (!currentUser) return alert("You must be logged in to dislike videos!");
    const v = videos[index];

    if (!v.likes) v.likes = [];
    if (!v.dislikes) v.dislikes = [];

    if (v.dislikes.includes(currentUser)) {
        v.dislikes = v.dislikes.filter(user => user !== currentUser);
    } else {
        v.dislikes.push(currentUser);
        v.likes = v.likes.filter(user => user !== currentUser);
    }

    localStorage.setItem("videos", JSON.stringify(videos));
    renderActionsPanel(index);
}

/* SHARE LINK SIMULATION PROCESSING */
function copyShareLink(index) {
    const mockUrl = `${window.location.origin}${window.location.pathname}?watch=${index}`;
    navigator.clipboard.writeText(mockUrl).then(() => {
        alert(`Link copied to clipboard!\n\n${mockUrl}`);
    }).catch(() => {
        alert("Failed to copy link using clipboard API automation.");
    });
}

/* HOME RENDER */
function render(){
    const users = getUsers();
    const homePageElement = document.getElementById("homePage");
    homePageElement.innerHTML = "";

    videos.forEach((v, idx) => {
        const user = users.find(u => u.username === v.uploader);
        const pfp = user && user.pfp ? user.pfp : DEFAULT_PFP;

        const cardDiv = document.createElement("div");
        cardDiv.className = "card";

        const thumbLink = document.createElement("div");
        thumbLink.className = "thumb-link";
        
        const thumbImg = document.createElement("img");
        thumbImg.src = v.thumb;
        thumbLink.appendChild(thumbImg);
        
        thumbLink.addEventListener("click", function() {
            openVideo(idx);
        });
        cardDiv.appendChild(thumbLink);

        const titleDiv = document.createElement("div");
        titleDiv.className = "title";
        titleDiv.textContent = v.title;
        cardDiv.appendChild(titleDiv);

        const smallDiv = document.createElement("div");
        smallDiv.className = "small";

        const pfpImg = document.createElement("img");
        pfpImg.src = pfp;
        pfpImg.style.cssText = "width:25px;height:25px;border-radius:50%;object-fit:cover;";
        smallDiv.appendChild(pfpImg);

        const userSpan = document.createElement("span");
        userSpan.className = "username";
        userSpan.textContent = v.uploader;
        
        userSpan.addEventListener("click", function(event) {
            openProfile(event, v.uploader);
        });
        
        smallDiv.appendChild(userSpan);
        cardDiv.appendChild(smallDiv);
        homePageElement.appendChild(cardDiv);
    });
}

/* PROFILE */
function openProfile(e, name){
    if(e && e.stopPropagation) e.stopPropagation();

    const activeVideo = document.querySelector("#videoPlayerContainer video");
    if(activeVideo) activeVideo.pause();

    const users = getUsers();
    document.getElementById("homePage").style.display = "none";
    document.getElementById("watchPage").style.display = "none";
    
    const profilePageElement = document.getElementById("profilePage");
    profilePageElement.style.display = "block";

    const user = users.find(u => u.username === name);
    const pfp = user && user.pfp ? user.pfp : DEFAULT_PFP;
    
    const profileTitleElement = document.getElementById("profileTitle");
    profileTitleElement.innerHTML = "";
    
    const bigPfp = document.createElement("img");
    bigPfp.src = pfp;
    bigPfp.style.cssText = "width:60px;height:60px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:10px;";
    
    profileTitleElement.appendChild(bigPfp);
    profileTitleElement.appendChild(document.createTextNode(esc(name)));

    const profileVideosElement = document.getElementById("profileVideos");
    profileVideosElement.innerHTML = "";

    videos.forEach((v, idx) => {
        if(v.uploader !== name) return;

        const cardDiv = document.createElement("div");
        cardDiv.className = "card";

        const thumbLink = document.createElement("div");
        thumbLink.className = "thumb-link";

        const thumbImg = document.createElement("img");
        thumbImg.src = v.thumb;
        thumbLink.appendChild(thumbImg);
        
        thumbLink.addEventListener("click", function() {
            openVideo(idx);
        });
        cardDiv.appendChild(thumbLink);

        const titleDiv = document.createElement("div");
        titleDiv.className = "title";
        titleDiv.textContent = v.title;
        cardDiv.appendChild(titleDiv);

        profileVideosElement.appendChild(cardDiv);
    });
}

/* BACK / LOGO CLICK HOME ROUTINE (RETURNS TO HOME FEED / VIDEO MENU) */
function backHome(){
    const activeVideo = document.querySelector("#videoPlayerContainer video");
    if(activeVideo) activeVideo.pause();

    currentVideoIndex = null;
    document.getElementById("profilePage").style.display = "none";
    document.getElementById("watchPage").style.display = "none";
    document.getElementById("homePage").style.display = "grid";
    render();
}

/* INIT */
function init(){
    updateUI();
    render();
}

init();

</script>
